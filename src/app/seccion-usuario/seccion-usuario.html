<main class="login-container" role="main">

  <div class="login-card">

    <!-- Pestañas accesibles -->
    <div class="tabs" role="tablist">

      <button 
        class="tab-button active" 
        role="tab"
        aria-selected="true"
        aria-controls="loginForm"
        id="tab-login"
        data-tab="login">
        Iniciar Sesión
      </button>

      <button 
        class="tab-button" 
        role="tab"
        aria-selected="false"
        aria-controls="registerForm"
        id="tab-register"
        data-tab="register">
        Registrarse
      </button>

    </div>

    <!-- FORMULARIO LOGIN -->
    <form 
      class="login-form active" 
      id="loginForm"
      role="tabpanel"
      aria-labelledby="tab-login">

      <h3>Bienvenido de nuevo</h3>

      <div class="form-group">
        <label for="loginUsuario">Usuario o Email</label>
        <input
          type="text"
          id="loginUsuario"
          class="form-input"
          placeholder="Ingresa tu usuario o email"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="loginClave">Contraseña</label>
        <input
          type="password"
          id="loginClave"
          class="form-input"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        >
      </div>

      <div class="form-options">

        <label class="checkbox-label" for="recordarLogin">
          <input type="checkbox" id="recordarLogin">
          Recordar sesión
        </label>

        <a routerLink="/recuperar" class="forgot-link">
          ¿Olvidaste tu contraseña?
        </a>

      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Ingresar
      </button>

    </form>

    <!-- FORMULARIO REGISTRO -->
    <form 
      class="login-form" 
      id="registerForm"
      role="tabpanel"
      aria-labelledby="tab-register">

      <h3>Crear nueva cuenta</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="regNombre">Nombre</label>
          <input
            type="text"
            id="regNombre"
            class="form-input"
            placeholder="Tu nombre"
            autocomplete="given-name"
          >
        </div>

        <div class="form-group">
          <label for="regApellido">Apellido</label>
          <input
            type="text"
            id="regApellido"
            class="form-input"
            placeholder="Tu apellido"
            autocomplete="family-name"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input
          type="email"
          id="regEmail"
          class="form-input"
          placeholder="tu@email.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="regUsuario">Usuario</label>
        <input
          type="text"
          id="regUsuario"
          class="form-input"
          placeholder="Elige un nombre de usuario"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="regClave">Contraseña</label>
        <input
          type="password"
          id="regClave"
          class="form-input"
          placeholder="Crea una contraseña segura"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="regConfirmarClave">Confirmar Contraseña</label>
        <input
          type="password"
          id="regConfirmarClave"
          class="form-input"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
        >
      </div>

      <label class="checkbox-label" for="aceptarTerminos">
        <input type="checkbox" id="aceptarTerminos">
        Acepto los términos y condiciones
      </label>

      <button type="submit" class="btn btn-primary btn-full">
        Crear Cuenta
      </button>

    </form>

  </div>

</main>
