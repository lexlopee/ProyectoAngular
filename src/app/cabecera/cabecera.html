<nav class="navbar" aria-label="Navegación principal">

  <!-- LOGO -->
  <div class="logo">
    <a routerLink="" aria-label="Ir a la página principal" aria-current="page">
      FashionStore
    </a>
  </div>

  <!-- BOTÓN MENÚ HAMBURGUESA ACCESIBLE -->
  <button 
    class="menu-toggle" 
    aria-label="Abrir menú de navegación"
    aria-expanded="false"
    aria-pressed="false"
    aria-controls="menu-principal"
    type="button">
      <span></span>
      <span></span>
      <span></span>
  </button>

  <!-- MENÚ PRINCIPAL -->
  <ul class="nav-links" id="menu-principal" role="menubar">
    <li role="none">
      <a role="menuitem" routerLink="camisetas" routerLinkActive="active" aria-current="page">Camisetas</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="pantalones" routerLinkActive="active" aria-current="page">Pantalones</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="chaquetas" routerLinkActive="active" aria-current="page">Chaquetas</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="accesorios" routerLinkActive="active" aria-current="page">Accesorios</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="zapatos" routerLinkActive="active" aria-current="page">Zapatos</a>
    </li>

    <li role="none">
      <a 
        role="menuitem"
        routerLink="cesta" 
        routerLinkActive="active"
        aria-label="Ver cesta de la compra"
        aria-current="page">
        Cesta 🛒 <span id="cantidadCesta">{{ cantidadCesta }}</span>
      </a>
    </li>

    <li role="none">
      <a role="menuitem" routerLink="seccion-usuario" routerLinkActive="active" aria-current="page">
        Sección usuario
      </a>
    </li>
  </ul>

  <!-- USUARIO -->
  <ul class="usuario-buscador" role="navigation" aria-label="Opciones de usuario">
    <ng-container *ngIf="usuario">
      <li class="usuario-nav">
        <span class="usuario-nombre">{{ usuario }}</span>

        <button 
          class="btn-logout" 
          (click)="cerrarSesion()"
          aria-label="Cerrar sesión del usuario"
          type="button">
          Cerrar sesión
        </button>
      </li>
    </ng-container>
  </ul>

  <!-- BUSCADOR -->
  <app-buscador aria-label="Buscador de productos" role="search"></app-buscador>

</nav>
