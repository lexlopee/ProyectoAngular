<nav class="navbar" aria-label="Navegación principal">

  <!-- LOGO izquierda -->
  <div class="logo">
    <a routerLink="" aria-label="FashionStore - Ir a la página principal">
      FashionStore
    </a>
  </div>

  <!-- BOTÓN HAMBURGUESA (solo móvil) -->
  <button
    class="menu-toggle"
    aria-label="Abrir menú de navegación"
    aria-expanded="false"
    aria-controls="menu-principal"
    type="button">
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>

  <!-- MENÚ CENTRADO -->
  <ul class="nav-links" id="menu-principal" role="menubar" aria-label="Menú principal">
    <li role="none">
      <a role="menuitem" routerLink="camisetas" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">Camisetas</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="pantalones" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">Pantalones</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="chaquetas" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">Chaquetas</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="accesorios" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">Accesorios</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="zapatos" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">Zapatos</a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="cesta" routerLinkActive="active"
         aria-label="Ver cesta de la compra, {{ cantidadCesta }} productos">
        Cesta 🛒 <span aria-hidden="true">{{ cantidadCesta }}</span>
      </a>
    </li>
    <li role="none">
      <a role="menuitem" routerLink="seccion-usuario" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">
        Mi cuenta
      </a>
    </li>
  </ul>

  <!-- ZONA DERECHA: buscador + sesión -->
  <div class="navbar-derecha">
    <app-buscador role="search" aria-label="Buscador de productos"></app-buscador>

    <ng-container *ngIf="usuario">
      <span class="usuario-nombre" aria-live="polite">Hola, {{ usuario }}</span>
      <button
        class="btn-logout"
        (click)="cerrarSesion()"
        aria-label="Cerrar sesión del usuario {{ usuario }}"
        type="button">
        Salir
      </button>
    </ng-container>
  </div>

</nav>
