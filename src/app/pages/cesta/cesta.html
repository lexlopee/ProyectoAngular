<main class="cesta-container" role="main">

  <h1>Mi Cesta</h1>

  <!-- Mensaje accesible cuando está vacía -->
  <p id="vacia" aria-live="polite" style="display:none;">
    La cesta está vacía
  </p>

  <!-- Lista accesible de productos -->
  <div 
    id="lista-cesta" 
    role="list" 
    aria-label="Productos en la cesta">
  </div>

  <!-- Total accesible -->
  <div class="total-cesta">
    Total: 
    <span id="total-cesta" aria-live="polite">0.00</span> €
  </div>

  <!-- Botón accesible para vaciar -->
  <button 
    id="vaciar-cesta" 
    class="vaciar"
    aria-label="Vaciar todos los productos de la cesta">
    Vaciar cesta
  </button>

</main>
