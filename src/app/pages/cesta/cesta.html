<h2>Mi Cesta</h2>
<!-- Título de la sección de la cesta -->

<div id="vacia" style="display:none;">La cesta está vacía</div>
<!-- Mensaje que aparece solo cuando no hay productos en la cesta.
     Por defecto está oculto con display:none. -->

<div id="lista-cesta"></div>
<!-- Contenedor donde se mostrarán dinámicamente los productos añadidos a la cesta. -->

<div class="total-cesta">
  Total: <span id="total-cesta"></span> €
</div>
<!-- Aquí se muestra el total acumulado de los productos de la cesta.
     El span #total-cesta se actualizará dinámicamente desde el componente. -->

<button id="vaciar-cesta" (click)="vaciar()">Vaciar cesta</button>
<!-- Botón para vaciar toda la cesta. Llama al método 'vaciar()' del componente
     correspondiente cuando se hace click. -->
