<div id="mensaje" class="mensaje"></div>
<!-- Contenedor para mostrar mensajes temporales cuando se añade un producto al carrito. -->

<section class="chaquetas">
  <h2>Chaquetas</h2>
  <!-- Título de la sección de chaquetas -->

  <div class="galeria">
    <!-- Contenedor que agrupa todas las tarjetas de productos -->

    <!-- Primer producto: Chaqueta Azul -->
    <div class="tarjeta">
      <img
        src="https://www.botteroski.com/46890-medium_default/458336-chaqueta-de-plumas-the-north-face-diablo.jpg"
        alt="Chaqueta Azul"
      />
      <!-- Imagen del producto con texto alternativo -->

      <h3>Chaqueta Azul Diablo North Face</h3>
      <!-- Nombre del producto -->

      <p class="precio">150.00€</p>
      <!-- Precio del producto -->

      <button
        (click)="anadir(
          'Chaqueta Azul Diablo North Face',
          150.00,
          'https://www.botteroski.com/46890-medium_default/458336-chaqueta-de-plumas-the-north-face-diablo.jpg'
        )"
      >
        Añadir al carrito
      </button>
      <!-- Botón que llama al método 'anadir' del componente Angular,
           pasando nombre, precio e imagen del producto. -->
    </div>

    <!-- Segundo producto: Chaqueta Roja Deportiva -->
    <div class="tarjeta">
      <img
        src="https://cdn.siroko.com/products/67c58e51dac0a/590/704/crop_center.jpg?v=1743160410"
        alt="Chaqueta Roja Deportiva"
      />
      <h3>Chaqueta Roja Deportiva</h3>
      <p class="precio">59.99€</p>
      <button
        (click)="anadir(
          'Chaqueta Roja Deportiva',
          59.9,
          'https://cdn.siroko.com/products/67c58e51dac0a/590/704/crop_center.jpg?v=1743160410'
        )"
      >
        Añadir al carrito
      </button>
    </div>

    <!-- Tercer producto: Chaqueta Cuero -->
    <div class="tarjeta">
      <img
        src="https://store.hondacanarias.com/media/catalog/product/cache/2d3e303121a652959edd5ff74af5177b/2/3/233-7520022-54_1.jpg"
        alt="Chaqueta Cuero"
      />
      <h3>Chaqueta Cuero</h3>
      <p class="precio">109.99€</p>
      <button
        (click)="anadir(
          'Chaqueta Cuero',
          109.99,
          'https://store.hondacanarias.com/media/catalog/product/cache/2d3e303121a652959edd5ff74af5177b/2/3/233-7520022-54_1.jpg'
        )"
      >
        Añadir al carrito
      </button>
    </div>

    <!-- Cuarto producto: Abrigo Pelo Largo -->
    <div class="tarjeta">
      <img
        src="https://www.bolf.es/hpeciai/d7cdd685aebdd46e3fcfc158d18a6b9e/spa_pl_Abrigo-forrado-largo-de-invierno-para-mujer-camel-Bolf-AN105-87340_16.jpg"
        alt="Abrigo Pelo Largo"
      />
      <h3>Abrigo Pelo Largo</h3>
      <p class="precio">79.99€</p>
      <button
        (click)="anadir(
          'Abrigo Pelo Largo',
          79.99,
          'https://www.bolf.es/hpeciai/d7cdd685aebdd46e3fcfc158d18a6b9e/spa_pl_Abrigo-forrado-largo-de-invierno-para-mujer-camel-Bolf-AN105-87340_16.jpg'
        )"
      >
        Añadir al carrito
      </button>
    </div>
    <!-- Quinto producto: Chaqueta Elegante Azul -->
    <div class="tarjeta">
      <img
        src="https://delaespriellastyle.com/media/catalog/product/cache/7a3ea6ca3d1f7e49ca627023822d1a6b/f/a/fa070010-1_1.jpg"
        alt="Chaqueta Elegante Azul"
      />
      <h3>Chaqueta Elegante Azul</h3>
      <p class="precio">85.00€</p>
      <button
        (click)="anadir(
          'Chaqueta Elegante Azul',
          79.99,
          'https://delaespriellastyle.com/media/catalog/product/cache/7a3ea6ca3d1f7e49ca627023822d1a6b/f/a/fa070010-1_1.jpg'
        )"
      >
        Añadir al carrito
      </button>
    </div>
    <!-- Sexto producto: Chaqueta Invierno -->
    <div class="tarjeta">
      <img
        src="https://pix.bonprix.es/imgc/0/0/2/5/1/2/1/2/4/5/_235/25121245/chaqueta-de-invierno-con-capucha-y-detalles-de-piel-sintetica.jpg"
        alt="Chaqueta Invierno"
      />
      <h3>Chaqueta Invierno</h3>
      <p class="precio">40.00€</p>
      <button
        (click)="anadir(
          'Chaqueta Invierno',
          40.00,
          'https://pix.bonprix.es/imgc/0/0/2/5/1/2/1/2/4/5/_235/25121245/chaqueta-de-invierno-con-capucha-y-detalles-de-piel-sintetica.jpg'
        )"
      >
        Añadir al carrito
      </button>
    </div>

  </div>
  <!-- Fin de galería de chaquetas -->
</section>
