<!-- Mensaje flotante accesible -->
<div id="mensaje" class="mensaje" aria-live="assertive"></div>

<main class="chaquetas" role="main">

    <!-- 1. Chaqueta Azul Diablo North Face -->
    <div 
      class="tarjeta"
      role="listitem"
      role="article"
      tabindex="0"
      aria-label="Chaqueta Azul Diablo North Face, precio 150 euros"
    >
      <img
        src="https://www.botteroski.com/46890-medium_default/458336-chaqueta-de-plumas-the-north-face-diablo.jpg"
        alt="Chaqueta Azul Diablo North Face"
      />
      <h3>Chaqueta Azul Diablo North Face</h3>
      <p class="precio">150.00€</p>

      <button
        aria-label="Añadir Chaqueta Azul Diablo North Face al carrito"
        (click)="anadir(
          'Chaqueta Azul Diablo North Face',
          150.00,
          'https://www.botteroski.com/46890-medium_default/458336-chaqueta-de-plumas-the-north-face-diablo.jpg'
        )"
      >
        Añadir al carrito
      </button>
